[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mini-agent-harness"
version = "0.1.0"
description = "A modular, standalone agent harness inspired by learn-claude-code s15"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "zhoufeng9"}]
dependencies = [
  "anthropic>=0.49,<1",
  "openai>=1.68,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
  "mcp>=1.28,<2",
  "croniter>=6,<7",
  "prompt-toolkit>=3.0.50,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2", "hatchling>=1.27,<2", "editables>=0.5,<1"]

[project.scripts]
mini-agent = "mini_agent_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_agent_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
